[build]
  command = "npx prisma generate && npx prisma generate --config=prisma.production.config.ts && npx prisma migrate deploy --config=prisma.production.config.ts && npx tsx prisma/seed.ts && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"
