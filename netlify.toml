[build]
  # aplicar-migracoes.mjs aplica no Neon as migrações de prisma/migracoes-producao que faltam:
  # em produção no POSTGRES_URL; no site de teste (branch `teste`) só no POSTGRES_URL_TESTE.
  command = "npx prisma generate && npx prisma generate --config=prisma.production.config.ts && node scripts/aplicar-migracoes.mjs && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"
