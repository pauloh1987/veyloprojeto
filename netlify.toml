[build]
  # aplicar-migracoes.mjs aplica no Neon (POSTGRES_URL, só em produção) as migrações de
  # prisma/migracoes-producao que faltam; sem POSTGRES_URL não faz nada.
  command = "npx prisma generate && npx prisma generate --config=prisma.production.config.ts && node scripts/aplicar-migracoes.mjs && npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "24"
